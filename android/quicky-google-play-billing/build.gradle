// Quicky — first-party Google Play Billing Capacitor plugin module
// (Monetization PRD §5.3).
//
// Wraps com.android.billingclient:billing (Play Billing Library 8.x) and
// registers the native plugin "GooglePlayBilling", which the web app
// detects at runtime via window.Capacitor.Plugins.GooglePlayBilling
// (src/lib/quicky/payments/client.ts).
//
// The plugin ONLY surfaces the purchase token from the Play sheet:
//   initialize()        → connect the BillingClient
//   queryProductDetails → pre-check a product exists (Play Console ids)
//   launchBillingFlow   → run the purchase sheet, resolve with purchases
//                         (USER_CANCELED → empty list, PENDING → state 1)
// Verification, crediting, acknowledgment and consumption all happen
// SERVER-side (POST /api/quicky/payments/google-play/verify → Play
// Developer API), so nothing here can mint currency by itself.
//
// Wired from android/settings.gradle + android/app/build.gradle (both
// hand-edited, NOT regenerated by `cap sync` — unlike capacitor.settings.gradle
// / capacitor.build.gradle which only carry npm-based plugins).

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.quicky.plugin.googleplaybilling"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Capacitor plugin API (provided at runtime by :capacitor-android)
    implementation project(':capacitor-android')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Google Play Billing Library 8.x — Play Console requires >= 8 for
    // app updates published after Aug 31, 2026.
    implementation 'com.android.billingclient:billing-ktx:8.3.0'
}
