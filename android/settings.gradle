include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

// Local first-party plugin — Google Play Billing (Monetization PRD §5.3).
// Hand-wired here on purpose: this settings file is NOT regenerated by
// `cap sync` (that only rewrites capacitor.settings.gradle below), so the
// include survives every sync. The module is also added to the app's
// dependencies in app/build.gradle.
include ':quicky-google-play-billing'
project(':quicky-google-play-billing').projectDir = new File('./quicky-google-play-billing/')

apply from: 'capacitor.settings.gradle'